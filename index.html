<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate and download your BTEUP Direct Admit Card and Verification Card instantly using your enrollment number.">
    <title>BTEUP Direct Admit Card</title>
    
    <!-- Prevents the 404 favicon.ico console error -->
    <link rel="icon" href="data:,">
    
    <style>
        :root { --p: #FF671F; --s: #046A38; --err: #ff3b30; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f0f0f5; display: flex; justify-content: center; min-height: 100dvh; color: #333; }
        .container { width: 100%; max-width: 768px; padding: 16px; margin-top: 16px; box-sizing: border-box; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; height: 48px; padding: 0 12px; font-size: 1.1rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; transition: .2s; }
        input:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.25); }
        .feedback { min-height: 24px; margin: 4px 0 12px; font-size: 0.85rem; color: var(--err); opacity: 0; transition: .3s; }
        .feedback.show { opacity: 1; }
        button { width: 100%; min-height: 56px; padding: 12px; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: 700; color: #fff; cursor: pointer; margin-bottom: 16px; transition: .3s; }
        button:disabled { background: #ccc !important; color: #666; cursor: not-allowed; }
        button:not(:disabled):active { transform: scale(0.98); }
        
        #btn1 { background: var(--p); color: #111; } 
        #btn2 { background: var(--s); }
        
        /* CSS width/height ensures it stays responsive despite inline attributes */
        img { width: 100%; height: auto; border-radius: 8px; }
        
        .footer { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 12px; font-size: 0.8rem; color: #666; text-align: center; }
        .footer p { margin: 4px 0; }
        
        /* Blogger Overrides */
        .sidebar, .post-footer, .blog-pager, .comments, .widget, .footer-outer, #navbar-iframe { display: none !important; }
    </style>
</head>
<body>
    <main class="container">
        <h1>BTEUP Direct Admit Card</h1>
        
        <label for="trackId">Enter Your Enrollment No</label>
        <input type="text" id="trackId" placeholder="Enter Enrollment ID Here" maxlength="20" autofocus>
        <div id="msg" class="feedback"></div>

        <button id="btn1" disabled>Get Admit Card</button>
        <button id="btn2" disabled>Get Verification Card</button>
        
        <!-- Added explicit width and height to prevent CLS -->
        <img src="https://images.hindustantimes.com/rf/image_size_630x354/HT/p2/2020/06/28/Pictures/metropolitan-minister-narendra-birthday-addresses-during-celebrations_e332f872-b8ed-11ea-b212-8f8a0313eef6.jpg" 
             alt="Modi Ji image" 
             fetchpriority="high" 
             width="630" 
             height="354">
               
        <div class="footer">
            <p>Last Updated: <span id="time">Loading...</span></p>
            <p>Total Visitors: <span id="views">--</span></p>
        </div>
    </main>

    <script>
        // Cache DOM elements cleanly
        const $ = id => document.getElementById(id);
        const [input, msg, btn1, btn2, time, views] = ['trackId', 'msg', 'btn1', 'btn2', 'time', 'views'].map($);

        // Streamlined Validation
        const validate = v => v.length < 10 ? "ID must be at least 10 characters." : v.length > 20 ? "ID cannot exceed 20 characters." : !/^[a-zA-Z0-9]+$/.test(v) ? "Only letters and numbers are allowed." : "";

        input.oninput = () => {
            const err = validate(input.value.trim());
            btn1.disabled = btn2.disabled = !!err;
            msg.textContent = err;
            msg.className = err ? 'feedback show' : 'feedback';
        };

        // Streamlined Redirects
        const go = url => () => !btn1.disabled && window.open(url + encodeURIComponent(input.value.trim()), '_blank');
        btn1.onclick = go("https://bteup.ac.in/ESeva/Student/AdmitCard.aspx?EnrollNumber=");
        btn2.onclick = go("https://bteup.ac.in/ESeva/Student/VerificationCard.aspx?EnrollNumber=");

        // Set Last Updated Time
        time.textContent = new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });

        // Local Device Visit Counter (Increments on every load/refresh)
        let visits = parseInt(localStorage.getItem('bteup_device_visits') || '0', 10);
        visits += 1; // Add 1 for the current visit
        localStorage.setItem('bteup_device_visits', visits); // Save it back to the device
        
        // Math: 1st visit = 1000, 2nd visit = 1001, 85th visit = 1084
        let displayCount = 1000 + (visits - 1);
        
        views.textContent = displayCount + "+";
    </script>
</body>
</html>
